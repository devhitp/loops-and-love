<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Settings | Loops & Love Admin</title>

    <link rel="stylesheet" href="css/admin.css" />
    

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>

  <body>
    <div class="admin-layout">
      <!-- Sidebar -->

      <aside class="admin-sidebar">
        <h2>🧶 Loops & Love</h2>

        <nav>
          <a href="admin-dashboard.html"> 📊 Dashboard </a>

          <a href="admin-products.html"> 🧶 Products </a>

          <a href="admin-orders.html"> 📦 Orders </a>

          <a href="admin-customers.html"> 👥 Customers </a>

          <a href="admin-settings.html" class="active"> ⚙ Settings </a>
        </nav>

        <button id="logout-btn">Logout</button>
      </aside>

      <!-- Main -->

      <main class="admin-main">
        <header class="admin-topbar">
          <h1>Store Settings</h1>

          <p>Manage your store configuration</p>
        </header>

        <section class="settings-container">
          <!-- Store Information -->

          <div class="settings-card">
            <h2>🏪 Store Information</h2>

            <div class="settings-form">
              <div class="form-group">
                <label>Store Name</label>

                <input type="text" id="store-name" placeholder="Loops & Love" />
              </div>

              <div class="form-group">
                <label>Email</label>

                <input
                  type="email"
                  id="store-email"
                  placeholder="support@example.com"
                />
              </div>

              <div class="form-group">
                <label>Phone</label>

                <input
                  type="text"
                  id="store-phone"
                  placeholder="+91 9876543210"
                />
              </div>

              <div class="form-group">
                <label>Address</label>

                <textarea
                  id="store-address"
                  rows="4"
                  placeholder="Enter store address"
                ></textarea>
              </div>

              <button id="save-store-info" class="save-settings-btn">
                Save Information
              </button>
            </div>
          </div>

          <!-- Business -->

          <div class="settings-card">
            <h2>💰 Business Settings</h2>

            <div class="settings-form">
              <div class="form-group">
                <label>Shipping Charge (₹)</label>

                <input type="number" id="shipping-charge" placeholder="50" />
              </div>

              <div class="form-group">
                <label>Free Shipping Above (₹)</label>

                <input
                  type="number"
                  id="free-shipping-limit"
                  placeholder="999"
                />
              </div>

              <div class="form-group">
                <label>Tax (%)</label>

                <input type="number" id="tax-rate" placeholder="18" />
              </div>

              <button id="save-business-settings" class="save-settings-btn">
                Save Business Settings
              </button>
            </div>
          </div>

          <!-- Social -->

          <div class="settings-card">
            <h2>🌐 Social Media</h2>

            <div class="settings-form">
              <div class="form-group">
                <label> Instagram </label>

                <input
                  type="text"
                  id="instagram-link"
                  placeholder="https://instagram.com/..."
                />
              </div>

              <div class="form-group">
                <label> Facebook </label>

                <input
                  type="text"
                  id="facebook-link"
                  placeholder="https://facebook.com/..."
                />
              </div>

              <div class="form-group">
                <label> WhatsApp </label>

                <input
                  type="text"
                  id="whatsapp-link"
                  placeholder="https://wa.me/..."
                />
              </div>

              <div class="form-group">
                <label> YouTube </label>

                <input
                  type="text"
                  id="youtube-link"
                  placeholder="https://youtube.com/..."
                />
              </div>

              <button id="save-social-settings" class="save-settings-btn">
                Save Social Links
              </button>
            </div>
          </div>

          <!-- Theme -->

          <div class="settings-card">
            <h2>🎨 Theme Settings</h2>

            <div class="settings-form">
              <div class="form-group">
                <label> Primary Color </label>

                <input type="color" id="primary-color" />
              </div>

              <div class="form-group">
                <label> Secondary Color </label>

                <input type="color" id="secondary-color" />
              </div>

              <div class="form-group">
                <label> Button Color </label>

                <input type="color" id="button-color" />
              </div>

              <button id="save-theme-settings" class="save-settings-btn">
                Save Theme
              </button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="js/admin.js"></script>
    <script src="js/admin-settings.js"></script>
  </body>
</html>
