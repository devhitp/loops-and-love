<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Admin Dashboard | Loops & Love</title>

    <link rel="stylesheet" href="css/admin.css" />
  </head>

  <body>
    <div class="admin-layout">
      <!-- SIDEBAR -->

      <aside class="admin-sidebar">
        <h2>🧶 Loops & Love</h2>

        <nav>
          <a href="#" class="active"> 📊 Dashboard </a>

          <a href="admin-products.html"> 🧶 Products </a>

          <a href="admin-orders.html"> 📦 Orders </a>

          <a href="#"> 👥 Customers </a>

          <a href="#"> ⚙ Settings </a>
        </nav>

        <button id="logout-btn">Logout</button>
      </aside>

      <!-- MAIN CONTENT -->

      <main class="admin-main">
        <header class="admin-topbar">
          <h1>Dashboard</h1>

          <p>Welcome back, Admin</p>
        </header>

        <!-- STATS -->

        <section class="stats-grid">
          <div class="stat-card">
            <h3>Products</h3>

            <strong> 0 </strong>
          </div>

          <div class="stat-card">
            <h3>Orders</h3>

            <strong> 0 </strong>
          </div>

          <div class="stat-card">
            <h3>Customers</h3>

            <strong> 0 </strong>
          </div>

          <div class="stat-card">
            <h3>Revenue</h3>

            <strong> ₹0 </strong>
          </div>
        </section>

        <!-- RECENT ORDERS -->

        <section class="admin-section">
          <h2>Recent Orders</h2>

          <div class="orders-table">
            <div class="table-header">
              <span> Order ID </span>

              <span> Customer </span>

              <span> Amount </span>

              <span> Status </span>
            </div>

            <div id="recent-orders"></div>
          </div>
        </section>
      </main>
    </div>

    <script src="js/admin.js"></script>

    <script src="js/admin-products.js"></script>
  </body>
</html>
