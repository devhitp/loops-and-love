<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Customers | Loops & Love Admin</title>

    <link rel="stylesheet" href="css/admin.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>

  <body>
    <div class="admin-layout">
      <!-- SIDEBAR -->

      <aside class="admin-sidebar">
        <h2>🧶 Loops & Love</h2>

        <nav>
          <a href="admin-dashboard.html"> 📊 Dashboard </a>

          <a href="admin-products.html"> 🧶 Products </a>

          <a href="admin-orders.html"> 📦 Orders </a>

          <a href="admin-customers.html" class="active"> 👥 Customers </a>

          <a href="admin-settings.html"> ⚙ Settings </a>
        </nav>

        <button id="logout-btn">Logout</button>
      </aside>

      <!-- MAIN CONTENT -->

      <main class="admin-main">
        <header class="admin-topbar">
          <h1>Customers</h1>

          <p>Manage your customers</p>
        </header>

        <section class="product-management">
          <div class="product-header">
            <h2>All Customers</h2>
            <input
              type="text"
              id="customer-search"
              class="search-input"
              placeholder="Search customers..."
            />
          </div>

          <div class="customers-table">
            <div class="table-header">
              <span>Name</span>

              <span>Phone</span>

              <span>Orders</span>

              <span>Spent</span>

              <span>Type</span>

              <span>Action</span>
            </div>

            <div class="empty-customers">No customers yet</div>
          </div>
        </section>
      </main>
    </div>
    <!-- ==========================================
CUSTOMER DETAILS MODAL
========================================== -->

    <div class="customer-modal" id="customer-modal">
      <div class="customer-modal-content">
        <button id="close-customer-modal" class="close-customer-modal">
          <i class="fa-solid fa-xmark"></i>
        </button>

        <h2>Customer Details</h2>

        <div id="customer-details"></div>
      </div>
    </div>

    <script type="module" src="js/admin.js"></script>

    <script type="module" src="js/admin-customers.js"></script>
  </body>
</html>
