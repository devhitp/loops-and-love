<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Manage Products | Loops & Love Admin</title>

    <link rel="stylesheet" href="css/admin.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>

  <body>
    <div class="admin-layout">
      <!-- SIDEBAR -->

      <aside class="admin-sidebar">
        <h2>🧶 Loops & Love</h2>

        <nav>
          <a href="admin-dashboard.html"> 📊 Dashboard </a>

          <a href="admin-products.html" class="active"> 🧶 Products </a>

          <a href="admin-orders.html"> 📦 Orders </a>

          <a href="admin-customers.html"> 👥 Customers </a>

          <a href="#"> ⚙ Settings </a>
        </nav>

        <button id="logout-btn">Logout</button>
      </aside>

      <!-- MAIN -->

      <main class="admin-main">
        <header class="admin-topbar">
          <h1>Products</h1>

          <p>Manage your handmade products</p>
        </header>

        <section class="product-management">
          <div class="product-header">
            <h2>All Products</h2>

            <button class="add-product-btn">
              <span>＋</span>
              Add Product
            </button>
          </div>

          <div class="products-toolbar">
            <div class="search-box">
              <i class="fa-solid fa-magnifying-glass"></i>

              <input
                type="text"
                id="product-search"
                placeholder="Search products..."
              />
            </div>
          </div>

          <div class="products-table">
            <div class="table-header">
              <span> Image </span>

              <span> Name </span>

              <span> Price </span>

              <span> Stock </span>

              <span> Actions </span>
            </div>

            <div class="empty-products">No products added yet</div>
          </div>
          <!-- ADD PRODUCT MODAL -->

          <div class="product-modal" id="product-modal">
            <div class="modal-content">
              <button class="close-modal" id="close-modal">×</button>

              <h2 id="modal-title">Add Product</h2>

              <form id="product-form">
                <div class="input-group">
                  <label> Product Name </label>

                  <input
                    type="text"
                    id="product-name"
                    placeholder="Enter product name"
                    required
                  />
                </div>

                <div class="input-group">
                  <label> Category </label>

                  <input
                    type="text"
                    id="product-category"
                    placeholder="Example: Crochet"
                    required
                  />
                </div>

                <div class="input-group">
                  <label> Price </label>

                  <input
                    type="number"
                    id="product-price"
                    placeholder="Enter price"
                    required
                  />
                </div>

                <div class="input-group">
                  <label> Image URL </label>

                  <input
                    type="text"
                    id="product-image"
                    placeholder="Image link"
                    required
                  />
                </div>

                <div class="input-group">
                  <label> Description </label>

                  <textarea
                    id="product-description"
                    placeholder="Product description"
                  ></textarea>
                </div>

                <div class="input-group">
                  <label> Stock </label>

                  <input
                    type="number"
                    id="product-stock"
                    placeholder="Available quantity"
                    required
                  />
                </div>

                <button type="submit" id="save-product-btn">
                  Save Product
                </button>
                <input type="hidden" id="edit-product-id" />
              </form>
            </div>
          </div>
        </section>
      </main>
    </div>

    <!-- ==========================================
DELETE MODAL
========================================== -->

    <div class="delete-modal" id="delete-modal">
      <div class="delete-box">
        <i class="fa-solid fa-triangle-exclamation"></i>

        <h2>Delete Product?</h2>

        <p id="delete-message"></p>

        <div class="delete-actions">
          <button id="cancel-delete" class="cancel-btn">Cancel</button>

          <button id="confirm-delete" class="confirm-btn">Delete</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast">
      <i class="fa-solid fa-circle-check"></i>
      <span id="toast-message"></span>
    </div>

    <script src="js/admin.js"></script>

    <script src="js/admin-products.js"></script>
  </body>
</html>
