<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Order Confirmed | Loops & Love</title>

    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/utilities.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>

  <body>
    <main class="success-page">
      <section class="page-hero">
        <div class="container">
          <div class="breadcrumb">
            <a href="index.html"> Home </a>

            <span>/</span>

            <span> Order Confirmed </span>
          </div>

          <h1>Order Confirmed</h1>

          <p>Thank you for shopping with Loops & Love.</p>
        </div>
      </section>

      <section class="success-content">
        <div class="container">
          <div class="success-card">
            <div class="success-icon">✓</div>

            <h1>
              Thank You
              <span id="customer-name"></span>!
            </h1>

            <p class="success-message">
              Your order has been placed successfully.
            </p>

            <div class="order-status">
              <span> Order Status </span>

              <strong> ✓ Confirmed </strong>
            </div>
            <div class="order-info">
              <div class="info-box">
                <span> Order ID </span>

                <strong id="order-id"> </strong>
              </div>

              <div class="info-box">
                <span> Order Date </span>

                <strong id="order-date"> </strong>
              </div>
            </div>

            <h2>Your Items</h2>

            <div id="order-items" class="order-items"></div>

            <div class="order-summary">

    <div class="summary-row">

        <span>
            Subtotal
        </span>

        <strong id="order-subtotal">
        </strong>

    </div>


    <div class="summary-row">

        <span>
            Shipping
        </span>

        <strong id="order-shipping">
        </strong>

    </div>


    <div class="summary-row">

        <span>
            Tax
        </span>

        <strong id="order-tax">
        </strong>

    </div>


    <hr>


    <div class="order-total">

        <span>
            Total
        </span>

        <strong id="order-total">
        </strong>

    </div>

</div>

            <div class="delivery-box">
              <i class="fa-solid fa-truck"></i>

              <div>
                <h3>Estimated Delivery</h3>

                <p>3-5 Business Days</p>
              </div>
            </div>

            <a href="shop.html" class="btn btn-primary"> Continue Shopping </a>
          </div>
        </div>
      </section>
    </main>

    <script src="https://kit.fontawesome.com/your-kit.js"></script>

    <script src="js/main.js"></script>
    <script src="js/products.js"></script>
    <script src="js/settings-loader.js"></script>
    <script src="js/order-success.js"></script>
  </body>
</html>
